<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân tích Lượng mưa với GEE - Web GIS</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        nav {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .nav-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5em;
            font-weight: bold;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        
        .page-header {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #00d9ff;
        }
        .page-title {
            font-size: 2em;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .control-row { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; min-width: 150px; }
        .form-group label { font-size: 0.85em; color: rgba(255,255,255,0.7); margin-bottom: 5px; }
        select, input {
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 0.95em;
        }
        select option { background: #1a1a2e; color: #fff; }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #00d9ff, #00ff88); 
            color: #1a1a2e;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 5px 20px rgba(0,217,255,0.4); 
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .gee-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.9em;
        }
        .gee-status.online {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.5);
            color: #4caf50;
        }
        .gee-status.offline {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.5);
            color: #f44336;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            border: 2px solid #00d9ff;
        }
        .modal-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #00d9ff;
        }
        .modal-body { margin-bottom: 20px; }
        .modal-footer { display: flex; gap: 10px; justify-content: flex-end; }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .log {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            margin-top: 15px;
        }
        .log-item {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            border-left: 4px solid #00d9ff;
        }
        .stat-value { font-size: 2em; font-weight: bold; margin-bottom: 5px; color: #00d9ff; }
        .stat-label { font-size: 0.9em; color: rgba(255,255,255,0.6); }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">🌍 Web GIS</div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <div class="page-title">🌧️ Phân tích Lượng mưa với GEE Integration</div>
            <div id="geeStatus" class="gee-status offline" style="margin-top: 15px;">
                ⏳ Đang kiểm tra GEE service...
            </div>
        </div>

        <div class="controls">
            <div class="control-row">
                <div class="form-group">
                    <label>📍 Địa điểm</label>
                    <select id="location">
                        <option value="1" data-province="Quang Tri">Quảng Trị</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>📅 Từ ngày</label>
                    <input type="date" id="startDate" value="2020-01-01">
                </div>
                <div class="form-group">
                    <label>📅 Đến ngày</label>
                    <input type="date" id="endDate" value="2020-12-31">
                </div>
                <button class="btn-secondary" onclick="openFetchModal()" id="btnFetch">
                    🌍 Tải từ GEE
                </button>
                <button class="btn-primary" onclick="loadData()">
                    🔍 Xem dữ liệu
                </button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalRain">--</div>
                <div class="stat-label">Tổng lượng mưa (mm)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgRain">--</div>
                <div class="stat-label">Trung bình (mm/ngày)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="maxRain">--</div>
                <div class="stat-label">Lượng mưa lớn nhất (mm)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="rainyDays">--</div>
                <div class="stat-label">Số ngày có dữ liệu</div>
            </div>
        </div>
    </div>

    <!-- Modal Fetch từ GEE -->
    <div id="fetchModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">🌍 Tải dữ liệu từ Google Earth Engine</div>
            <div class="modal-body">
                <p style="color: rgba(255,255,255,0.7); margin-bottom: 15px;">
                    Chọn loại dữ liệu cần tải:
                </p>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" value="rainfall" checked>
                        <span>🌧️ Lượng mưa (CHIRPS)</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" value="temperature">
                        <span>🌡️ Nhiệt độ (ERA5)</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" value="soil_moisture">
                        <span>💧 Độ ẩm đất (ERA5-Land)</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" value="ndvi">
                        <span>🌿 NDVI (MODIS)</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" value="tvdi">
                        <span>🔥 TVDI (MODIS)</span>
                    </label>
                </div>

                <div id="fetchProgress" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill">0%</div>
                    </div>
                    <div class="log" id="fetchLog"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeFetchModal()">Hủy</button>
                <button class="btn-primary" onclick="fetchFromGEE()" id="btnStartFetch">
                    🚀 Bắt đầu tải
                </button>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:3000/api';
        let geeOnline = false;

        // Kiểm tra GEE service
        async function checkGEEStatus() {
            try {
                const res = await fetch(`${API}/gee/status`);
                const data = await res.json();
                
                const statusEl = document.getElementById('geeStatus');
                if (data.status === 'online' && data.gee_initialized) {
                    statusEl.className = 'gee-status online';
                    statusEl.innerHTML = '✅ GEE Service: Online';
                    geeOnline = true;
                    document.getElementById('btnFetch').disabled = false;
                } else {
                    statusEl.className = 'gee-status offline';
                    statusEl.innerHTML = '❌ GEE Service: Offline - Vui lòng chạy: python api_server.py';
                    geeOnline = false;
                    document.getElementById('btnFetch').disabled = true;
                }
            } catch (err) {
                const statusEl = document.getElementById('geeStatus');
                statusEl.className = 'gee-status offline';
                statusEl.innerHTML = '❌ GEE Service: Không kết nối được';
                geeOnline = false;
                document.getElementById('btnFetch').disabled = true;
            }
        }

        // Mở modal
        function openFetchModal() {
            if (!geeOnline) {
                alert('GEE Service chưa sẵn sàng. Vui lòng chạy: python api_server.py');
                return;
            }
            document.getElementById('fetchModal').classList.add('show');
        }

        function closeFetchModal() {
            document.getElementById('fetchModal').classList.remove('show');
            document.getElementById('fetchProgress').style.display = 'none';
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('fetchLog').innerHTML = '';
        }

        // Tải dữ liệu từ GEE
        async function fetchFromGEE() {
            const locationEl = document.getElementById('location');
            const location_id = locationEl.value;
            const province = locationEl.options[locationEl.selectedIndex].dataset.province;
            const start_date = document.getElementById('startDate').value;
            const end_date = document.getElementById('endDate').value;

            // Get selected data types
            const checkboxes = document.querySelectorAll('#fetchModal input[type="checkbox"]:checked');
            const data_types = Array.from(checkboxes).map(cb => cb.value);

            if (data_types.length === 0) {
                alert('Vui lòng chọn ít nhất một loại dữ liệu');
                return;
            }

            // Show progress
            document.getElementById('fetchProgress').style.display = 'block';
            document.getElementById('btnStartFetch').disabled = true;
            
            const logEl = document.getElementById('fetchLog');
            const progressFill = document.getElementById('progressFill');
            
            logEl.innerHTML = '<div class="log-item">⏳ Đang kết nối GEE...</div>';
            progressFill.style.width = '10%';
            progressFill.textContent = '10%';

            try {
                const response = await fetch(`${API}/gee/fetch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        province,
                        location_id: parseInt(location_id),
                        start_date,
                        end_date,
                        data_types
                    })
                });

                progressFill.style.width = '50%';
                progressFill.textContent = '50%';
                logEl.innerHTML += '<div class="log-item">⏳ Đang xử lý dữ liệu...</div>';

                const result = await response.json();

                if (response.ok && result.success) {
                    progressFill.style.width = '100%';
                    progressFill.textContent = '100%';
                    
                    let logHtml = '<div class="log-item">✅ Hoàn thành!</div>';
                    Object.keys(result.results).forEach(key => {
                        const records = result.results[key].records;
                        logHtml += `<div class="log-item">📊 ${key}: ${records} bản ghi</div>`;
                    });
                    logEl.innerHTML = logHtml;

                    setTimeout(() => {
                        closeFetchModal();
                        loadData(); // Auto reload data
                    }, 2000);
                } else {
                    throw new Error(result.message || 'Unknown error');
                }

            } catch (err) {
                progressFill.style.width = '0%';
                logEl.innerHTML = `<div class="log-item" style="color: #f44336;">❌ Lỗi: ${err.message}</div>`;
            } finally {
                document.getElementById('btnStartFetch').disabled = false;
            }
        }

        // Load data for viewing
        async function loadData() {
            const locId = document.getElementById('location').value;
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;

            try {
                const res = await fetch(`${API}/rainfall?location_id=${locId}&start=${start}&end=${end}`);
                const data = await res.json();

                document.getElementById('totalRain').textContent = data.statistics.total;
                document.getElementById('avgRain').textContent = data.statistics.average;
                document.getElementById('maxRain').textContent = data.statistics.max;
                document.getElementById('rainyDays').textContent = data.statistics.days;

            } catch (err) {
                console.error('Error:', err);
                alert('Lỗi khi tải dữ liệu');
            }
        }

        // Init
        window.onload = () => {
            checkGEEStatus();
            setInterval(checkGEEStatus, 30000); // Check every 30s
        };
    </script>
</body>
</html>
